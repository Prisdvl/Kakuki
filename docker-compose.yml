# Kakuki 一键部署：docker compose up -d
# 前端 http://localhost  ·  后端 http://localhost/api/v1/  ·  Swagger http://localhost/api/v1/swagger/
services:
  db:
    image: mysql:8.0
    container_name: kakuki-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: kakuki-root
      MYSQL_DATABASE: kakuki
      MYSQL_USER: kakuki
      MYSQL_PASSWORD: kakuki123
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pkakuki-root"]
      interval: 10s
      timeout: 5s
      retries: 15

  backend:
    build: ./backend
    container_name: kakuki-backend
    restart: unless-stopped
    environment:
      DEBUG: "True"
      DJANGO_SECRET_KEY: kakuki-docker-secret
      USE_MYSQL: "True"
      DB_NAME: kakuki
      DB_USER: kakuki
      DB_PASSWORD: kakuki123
      DB_HOST: db
      DB_PORT: "3306"
      CORS_ALLOWED_ORIGINS: "http://localhost"
      THROTTLE_ANON: 120/min
      THROTTLE_USER: 300/min
    volumes:
      - ./backend/media:/app/media
    depends_on:
      db:
        condition: service_healthy
    # 首次启动自动建表 + 生成演示数据（幂等）
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_demo &&
             python manage.py runserver 0.0.0.0:8000"

  frontend:
    build: ./frontend
    container_name: kakuki-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data:
