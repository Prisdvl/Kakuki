<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 赫鬼风格 favicon：玄墨底 + 朱砂鬼面字，毛笔质感 -->
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1c20"/>
      <stop offset="1" stop-color="#0b0c0e"/>
    </linearGradient>
    <linearGradient id="cinnabar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e04a3a"/>
      <stop offset="1" stop-color="#b3271f"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="18" fill="url(#ink)"/>
  <!-- 朱砂印边框 -->
  <rect x="6.5" y="6.5" width="87" height="87" rx="14" fill="none" stroke="url(#cinnabar)" stroke-width="3" opacity="0.9"/>
  <!-- 「赫」上、「鬼」下，竖排 -->
  <text x="50" y="42" font-size="30" font-weight="900" fill="url(#cinnabar)"
        text-anchor="middle" dominant-baseline="middle"
        font-family="'KaiTi','STKaiti','Noto Serif SC','SimSun',serif">赫</text>
  <text x="50" y="70" font-size="30" font-weight="900" fill="#e8e2d6"
        text-anchor="middle" dominant-baseline="middle"
        font-family="'KaiTi','STKaiti','Noto Serif SC','SimSun',serif">鬼</text>
  <!-- 左上朱砂点：鬼面眼 -->
  <circle cx="20" cy="21" r="3.2" fill="#e04a3a"/>
  <circle cx="80" cy="79" r="3.2" fill="#e04a3a" opacity="0.85"/>
</svg>
