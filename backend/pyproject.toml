[project]
name = "kakuki"
version = "1.0.0"
description = "Kakuki - 基于 Django + React 的全栈个人博客系统"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyMySQL==1.1.1",
    "cryptography==43.0.3",
    "django==4.2.16",
    "djangorestframework==3.15.2",
    "django-cors-headers==4.4.0",
    "django-filter==24.3",
    "djangorestframework-simplejwt==5.3.1",
    "drf-spectacular==0.27.2",
    "Pillow==10.4.0",
    "python-dotenv==1.0.1",
    "uvicorn==0.30.6",
]

[project.urls]
Homepage = "https://github.com/kakuki/kakuki"

[dependency-groups]
